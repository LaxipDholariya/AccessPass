<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Brand Icon Badge -->
  <rect x="100" y="140" width="96" height="96" rx="20" fill="url(#accent)" />
  <g transform="translate(124, 164) scale(2)" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    <path d="m9 12 2 2 4-4"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="100" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Access<tspan fill="#3b82f6">Pass</tspan>
  </text>
  
  <text x="100" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#94a3b8">
    Digital Visitor Access Management System
  </text>

  <text x="100" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#cbd5e1" max-width="800">
    Pre-registration • Host Approvals • QR Security Gate Badges • Complete Audit Trails
  </text>

  <!-- Bottom status pill -->
  <rect x="100" y="490" width="280" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <circle cx="125" cy="511" r="6" fill="#10b981" />
  <text x="142" y="517" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">
    Secure &amp; Verifiable Access
  </text>
</svg>
