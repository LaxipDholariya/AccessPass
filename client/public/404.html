<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | AccessPass</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        background-color: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 0.75rem;
        padding: 2.5rem 2rem;
        max-width: 28rem;
        width: 100%;
        text-align: center;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      }
      .icon-box {
        width: 3.5rem;
        height: 3.5rem;
        background-color: #eff6ff;
        border: 1px solid #dbeafe;
        color: #2563eb;
        border-radius: 0.75rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.25rem;
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.625rem;
        background-color: #fef2f2;
        color: #b91c1c;
        border: 1px solid #fecaca;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.75rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 0.5rem;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 0.875rem;
        color: #64748b;
        line-height: 1.5;
        margin-bottom: 1.75rem;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.625rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.625rem 1.25rem;
        border-radius: 0.5rem;
        font-size: 0.8125rem;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 0.15s ease;
      }
      .btn-primary {
        background-color: #2563eb;
        color: #ffffff;
      }
      .btn-primary:hover {
        background-color: #1d4ed8;
      }
      .btn-secondary {
        background-color: #ffffff;
        color: #334155;
        border: 1px solid #cbd5e1;
      }
      .btn-secondary:hover {
        background-color: #f1f5f9;
      }
      .brand-footer {
        margin-top: 1.5rem;
        font-size: 0.75rem;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <div>
        <span class="badge">HTTP 404 — Not Found</span>
      </div>
      <h1>Page Not Found</h1>
      <p>
        The page you are looking for does not exist on AccessPass, may have been moved, or the URL entered is incorrect.
      </p>
      <div class="actions">
        <a href="/" class="btn btn-primary">Return to Homepage</a>
        <a href="/pass-lookup" class="btn btn-secondary">Visitor Pass Lookup</a>
      </div>
    </div>
    <div class="brand-footer">
      AccessPass — Digital Visitor Access Management System
    </div>
  </body>
</html>
