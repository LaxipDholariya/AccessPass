        <div style="padding: 2rem; max-width: 680px; margin: 0 auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #0f172a; line-height: 1.6;">
          <h1 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 0.75rem; color: #0f172a;">Digital Visitor Access Management System</h1>
          <p style="font-size: 1rem; color: #475569; margin-bottom: 1rem;">
            AccessPass is an enterprise visitor access management system designed for academic institutions, commercial facilities, and high-security complexes. The platform automates advance visitor self-registration, designated host authorizations, and cryptographic QR-code badge verification.
          </p>
          <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; color: #1e293b;">Standard Campus Visitor Lifecycle</h2>
          <p style="font-size: 0.9375rem; color: #64748b; margin-bottom: 0.5rem;">
            1. <strong>Online Appointment Registration:</strong> Visitors submit their full legal name, contact email, phone number, government ID proof, and requested facility.
          </p>
          <p style="font-size: 0.9375rem; color: #64748b; margin-bottom: 0.5rem;">
            2. <strong>Host Authorization:</strong> Faculty and staff hosts review incoming appointment requests and issue approvals with designated access windows.
          </p>
          <p style="font-size: 0.9375rem; color: #64748b; margin-bottom: 0.5rem;">
            3. <strong>Verifiable Digital QR Pass:</strong> Visitors receive an opaque reference code and private verification token granting access to their digital badge.
          </p>
          <p style="font-size: 0.9375rem; color: #64748b;">
            4. <strong>Security Terminal Check-in:</strong> Campus security personnel verify pass validity at physical gate entrances, recording physical entry and exit movements.
          </p>
